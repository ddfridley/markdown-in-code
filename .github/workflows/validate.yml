name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Prove heading contract rejects flattened sizes
        run: npm run test:contract:selftest
      - name: VS Code integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: VS Code integration (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Windows native link mouse regression
        if: runner.os == 'Windows'
        run: npm run test:navigation
      - name: Retain VS Code logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vscode-logs-${{ matrix.os }}
          path: |
            .vscode-test/sessions/**/user-data/logs/**
            .vscode-test/navigation/**/user-data/logs/**
          if-no-files-found: ignore
          retention-days: 7
  visual:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compare pinned Linux screenshots
        run: node scripts/run-visual-docker.mjs
      - name: Verify missing-border and offset failures
        run: node scripts/check-visual-mutations.mjs
      - name: Retain actual, expected, diffs, reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts-linux
          path: |
            .vscode-test/visual-artifacts/
            tests/visual/preliminary/
          if-no-files-found: warn
          retention-days: 14
